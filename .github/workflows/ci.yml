name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  TRIVY_VERSION: v0.73.0
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: "pnpm" }
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore host Turbo build cache
        id: host-turbo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nebula-host-turbo-v1-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nebula-host-turbo-v1-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Verify backend orchestration, release and CI policies
        run: pnpm test:backend-tooling
      - name: Verify storage supply and bootstrap regressions
        run: pnpm test:storage:setup
      - name: Prove selected build graphs and injected cache restoration
        run: pnpm test:build-graph scripts/docker/runtime-packaging.test.mjs
      - name: Verify selected native development lifecycle and shared refresh
        run: pnpm test:backend-dev
      - name: Verify backend Docker COPY inputs against the build context
        run: node scripts/docker/check-build-context.mjs
      - name: Classify and gate backend runtime dependencies
        run: pnpm scan:dependencies:backend
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }}
      - name: Verify proto generation
        run: pnpm proto:check
      - name: Lint backend workspaces
        run: pnpm lint:backend
      - name: Check backend types
        run: pnpm check-types:backend
      - name: Check live test types before provisioning
        run: node scripts/check-backend-test-types.mjs
      - name: Run focused container-free security tests
        run: pnpm test:security
      - name: Run shared backend unit and contract tests
        run: pnpm test:shared:backend
      - name: Run gateway unit and public-contract tests
        run: pnpm test:gateway:backend
      - name: Run authority foundation tests
        run: pnpm test:tenant-authority:backend
      - name: Verify generated external client and browser/mobile consumers
        run: pnpm test:external-client
      - name: Verify D1 and D2 demo ownership, rerun and reset fixtures
        run: pnpm test:demo:d1 && pnpm test:demo:d2
      - name: Run focused current-web compatibility tests
        run: pnpm test:web:current
      - name: Build backend sources
        run: pnpm build:backend
      - name: Materialize tracked example environment files
        run: pnpm backend:env
      - name: Validate and capture local and release Compose configurations
        run: pnpm evidence:compose:backend
      - name: Scan backend source for secrets and configuration defects
        run: pnpm scan:source:backend
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
      - name: Check host Turbo cache upload budget
        id: turbo-budget
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.host-turbo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sb .turbo/cache | cut -f1)" -le 1073741824 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "Host Turbo cache absent or above 1GiB; skipping upload."
          fi
      - name: Save bounded host Turbo build cache
        if: success() && steps.turbo-budget.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: ${{ steps.host-turbo.outputs.cache-primary-key }}
      - name: Retain bounded quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-quality-evidence
          path: |
            .security-reports/backend-dependencies.json
            .security-reports/backend-source.json
            .ci-evidence/compose-local.yaml
            .ci-evidence/compose-release.yaml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  live-e2e:
    needs: quality
    runs-on: ubuntu-latest
    env:
      BUILDX_BAKE_FILE: docker-compose.yml:docker-bake.hcl:.github/backend-cache.hcl
      COMPOSE_FILE: docker-compose.yml:docker/seaweedfs/compose.storage.yml:docker/seaweedfs/compose.bootstrap.yml:.github/seaweed-runtime.yml
      COMPOSE_ENV_FILES: .env,.nebula-storage/seaweedfs/.env
      NEBULA_CI_CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: "pnpm" }
      - run: pnpm i --frozen-lockfile
      - name: Restore host Turbo build cache
        id: host-turbo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nebula-host-turbo-v1-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nebula-host-turbo-v1-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }}
      - name: Set up pinned CI builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.28.0
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.24.0@sha256:6eceb8971ce4fceb3daca562832642706238b7eea72941fcf9896c93c3c4a53e
          cache-binary: false
          cleanup: true
      - name: Expose masked cache runtime credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing cache runtime field: ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Prepare private fresh-CI storage configuration
        run: |
          pnpm backend:env
          node scripts/storage/seaweed-setup.mjs prepare
      - name: Load checksum-pinned Seaweed vendor cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/nebula-seaweed-vendor"
          node --input-type=module - "$archive_dir" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync } from 'node:fs';
          import { readSupplyManifest, validateSupplyManifest } from './scripts/storage/seaweed-vendor-evidence.mjs';
          const vendor = validateSupplyManifest(readSupplyManifest());
          const directory = process.argv[2];
          mkdirSync(directory, { recursive: true });
          const files = [vendor.archive, ...Object.keys(vendor.evidenceSha256)];
          execFileSync('gh', ['release', 'download', vendor.releaseTag, '--repo', vendor.repository, '--dir', directory, ...files.flatMap(file => ['--pattern', file])], { stdio: 'inherit', timeout: 600000 });
          NODE
          node scripts/storage/seaweed-vendor-evidence.mjs load-archive "$archive_dir"
      - name: Validate selected fresh storage topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose version --short
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { validateRenderedComposeBoundary, configuredMediaStorage } from './scripts/backend.mjs';
          import assert from 'node:assert/strict';
          const render = args => JSON.parse(execFileSync('docker', ['compose', ...args, 'config', '--format', 'json'], { encoding: 'utf8', timeout: 15000, maxBuffer: 4 * 1024 * 1024 }));
          const local = render([]);
          validateRenderedComposeBoundary('local', local);
          assert.equal(configuredMediaStorage(local).service, 'seaweed');
          const files = ['docker-compose.release.yml', 'docker/seaweedfs/compose.storage.yml', 'docker/seaweedfs/compose.bootstrap.yml', '.github/seaweed-runtime.yml'];
          const release = render(['--env-file', 'deploy/.env.production.example', '--env-file', '.nebula-storage/seaweedfs/.env', ...files.flatMap(file => ['-f', file])]);
          validateRenderedComposeBoundary('release', release);
          assert.equal(configuredMediaStorage(release).service, 'seaweed');
          console.log('[seaweed-ci] selected local/release boundaries=ok');
          NODE
      - name: Build the pinned PostgreSQL and gosu vendor image
        shell: bash
        run: |
          set -euo pipefail
          cache_args=(--cache-from type=gha,scope=nebula-postgres-v1)
          if [ "$NEBULA_CI_CACHE_WRITE" = "true" ]; then
            cache_args+=(--cache-to type=gha,scope=nebula-postgres-v1,mode=max)
          fi
          docker buildx build --platform linux/amd64 \
            --file docker/postgres/security.Dockerfile \
            --tag nebulanv-vendor-postgres:18.6-gosu1.20-go1.26.10 \
            --load --progress=plain "${cache_args[@]}" docker/postgres
      - name: Scan the PostgreSQL vendor image with the existing policy
        run: |
          node --input-type=module <<'NODE'
          import { runBackendImageScans } from './scripts/backend.mjs';
          runBackendImageScans({ services: [{ dockerService: 'postgres', defaultImage: 'nebulanv-vendor-postgres:18.6-gosu1.20-go1.26.10' }] });
          NODE
      - name: Provision live integration services
        run: pnpm backend:boot
      - name: Verify historical Product metadata upgrade with current migration tails
        run: pnpm db:verify:product:metadata:upgrade
      - name: Prove live F3 gateway client profiles
        run: pnpm test:f3:live
      - name: Run live integration and e2e tests
        run: pnpm test:e2e
      - name: Scan the tested backend images
        run: pnpm scan:images:backend
      - name: Verify complete release archive round trip without a temporary tar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/docker/release-image-inventory.mjs > "$RUNNER_TEMP/release-images.json"
          node -e "for (const image of JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))) console.log(image)" "$RUNNER_TEMP/release-images.json" > "$RUNNER_TEMP/release-images.txt"
          mapfile -t release_images < "$RUNNER_TEMP/release-images.txt"
          test "${#release_images[@]}" -gt 0
          docker image inspect "${release_images[@]}" --format '{{.Id}}' > "$RUNNER_TEMP/release-image-ids-before.txt"
          docker image save "${release_images[@]}" | docker image load
          docker image inspect "${release_images[@]}" --format '{{.Id}}' > "$RUNNER_TEMP/release-image-ids-after.txt"
          cmp "$RUNNER_TEMP/release-image-ids-before.txt" "$RUNNER_TEMP/release-image-ids-after.txt"
      - name: Record tested backend image identities
        run: node scripts/docker/record-image-identities.mjs
      - name: Verify live checks leave tracked files unchanged
        if: always()
        run: git diff --exit-code
      - name: Capture bounded Compose evidence after a failure
        if: failure()
        run: pnpm evidence:failure:backend
      - name: Retain bounded live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-live-evidence
          path: |
            .security-reports/nebulanv-main-*.json
            .security-reports/nebulanv-vendor-postgres-*.json
            .ci-evidence/backend-tested-images.json
            .ci-evidence/seaweed-vendor.json
            .ci-evidence/compose-state.jsonl
            .ci-evidence/compose-logs.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Remove live integration resources
        if: always()
        run: docker compose down -v
