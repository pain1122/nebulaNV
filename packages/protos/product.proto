syntax = "proto3";

package product;

// -----------------------------------------
// Core DTO returned to clients
// -----------------------------------------
message Product {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  string excerpt = 5;
  string sku = 6;
  string status = 7; // DRAFT|ACTIVE|ARCHIVED

  double price = 8;
  string currency = 9;

  string categoryId = 10;

  // thumbnail (primary image)
  string thumbnailUrl = 11;

  // 3D
  string model3dUrl = 12;
  string model3dFormat = 13;
  bool   model3dLiveView = 14;
  string model3dPosterUrl = 15;

  // VR plan
  bool   vrEnabled = 16;
  string vrPlanImageUrl = 17;

  // SEO
  string metaTitle = 18;
  string metaDescription = 19;
  string metaKeywords = 20;
  string customSchema = 21;
  bool   noindex = 22;

  // presentation / promos
  bool   isFeatured = 23;
  int32  featureSort = 24;
  string promoTitle = 25;
  string promoBadge = 26;
  bool   promoActive = 27;

  // discount
  string discountType = 28; // "PERCENTAGE" | "FIXED" | "NONE"
  double discountValue = 29;
  bool   discountActive = 30;
  string discountStart = 31; // ISO8601 or ""
  string discountEnd = 32;   // ISO8601 or ""
  double effectivePrice = 33;

  // flat arrays to avoid heavy joins
  repeated string tags = 34;
  repeated string complementaryIds = 35;

  string createdAt = 36;
  string updatedAt = 37;
  string deletedAt = 38; // "" if not soft-deleted
  bool   trackInventory = 39;
  int32  stockQuantity = 40;
  string availability = 41; // AVAILABLE|OUT_OF_STOCK
  int32  version = 42;
  string selectionMode = 43; // BASE|VARIANT
  repeated ProductVariant variants = 44;
  string thumbnailMediaId = 45;
  string brandId = 46;
  repeated string tagIds = 47;
  string thumbnailTitle = 48;
  string thumbnailAlt = 49;
  optional string thumbnailTitleOverride = 50;
  optional string thumbnailAltOverride = 51;
  string effectivePriceAmount = 52; // exact two-decimal internal commerce amount
}

message ProductVariant {
  string id = 1;
  string productId = 2;
  string sku = 3;
  map<string, string> options = 4;
  double price = 5;
  optional double priceOverride = 6;
  double effectivePrice = 7;
  int32 stockQuantity = 8;
  string availability = 9;
  bool active = 10;
  int32 sortOrder = 11;
  string deletedAt = 12;
  string effectivePriceAmount = 13; // exact amount after parent discounts
}

// -----------------------------------------
// Lean inputs
// -----------------------------------------

message ProductInput {
  // required:
  string title = 1;
  string slug = 2;
  string sku = 3;
  double price = 4;
  string categoryId = 5;

  // optional:
  string description = 10;
  string excerpt = 11;
  string currency = 12;
  string status = 13; // default ACTIVE

  string thumbnailUrl = 20;

  string model3dUrl = 30;
  string model3dFormat = 31;
  bool   model3dLiveView = 32;
  string model3dPosterUrl = 33;

  bool   vrEnabled = 40;
  string vrPlanImageUrl = 41;

  string metaTitle = 50;
  string metaDescription = 51;
  string metaKeywords = 52;
  string customSchema = 53;
  bool   noindex = 54;

  bool   isFeatured = 60;
  int32  featureSort = 61;
  string promoTitle = 62;
  string promoBadge = 63;
  bool   promoActive = 64;

  string discountType = 70;  // optional
  double discountValue = 71;
  bool   discountActive = 72;
  string discountStart = 73;
  string discountEnd = 74;

  repeated string tags = 80;
  repeated string complementaryIds = 81;
  bool   trackInventory = 82;
  int32  stockQuantity = 83;
  string selectionMode = 84;
  string thumbnailMediaId = 85;
  string brandId = 87;
  repeated string tagIds = 88;
  optional string thumbnailTitle = 91;
  optional string thumbnailAlt = 92;
}

message ProductPatch {
  string title = 1;
  string slug = 2;
  string sku = 3;
  double price = 4;
  string categoryId = 5;

  string description = 10;
  string excerpt = 11;
  string currency = 12;
  string status = 13;

  string thumbnailUrl = 20;

  string model3dUrl = 30;
  string model3dFormat = 31;
  bool   model3dLiveView = 32;
  string model3dPosterUrl = 33;

  bool   vrEnabled = 40;
  string vrPlanImageUrl = 41;

  string metaTitle = 50;
  string metaDescription = 51;
  string metaKeywords = 52;
  string customSchema = 53;
  bool   noindex = 54;

  bool   isFeatured = 60;
  int32  featureSort = 61;
  string promoTitle = 62;
  string promoBadge = 63;
  bool   promoActive = 64;

  string discountType = 70;
  double discountValue = 71;
  bool   discountActive = 72;
  string discountStart = 73;
  string discountEnd = 74;

  repeated string tags = 80;
  repeated string complementaryIds = 81;
  bool   trackInventory = 82;
  int32  stockQuantity = 83;
  string selectionMode = 84;
  string thumbnailMediaId = 85;
  bool clearThumbnailMedia = 86;
  string brandId = 87;
  repeated string tagIds = 88;
  optional string thumbnailTitle = 91;
  optional string thumbnailAlt = 92;
  bool clearBrand = 89;
  bool replaceTagIds = 90;
  bool clearThumbnailTitle = 93;
  bool clearThumbnailAlt = 94;
}

// -----------------------------------------
// Requests / Responses
// -----------------------------------------
message CreateProductRequest { ProductInput data = 1; }
message UpdateProductRequest {
  string id = 1;
  ProductPatch data = 2;
  int32 expectedVersion = 3;
}
message GetProductRequest { string id = 1; }

message ListProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string q = 3;
  string categoryId = 4;
  string status = 5 [deprecated = true]; // retained for wire compatibility; public reads ignore it
  bool   includeDeleted = 6 [deprecated = true]; // retained for wire compatibility; public reads ignore it
}

message AdminListProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string q = 3;
  string categoryId = 4;
  string status = 5;
  bool   includeDeleted = 6;
}

message DeleteProductRequest { string id = 1; }
message RestoreProductRequest { string id = 1; }
message HardDeleteProductRequest { string id = 1; }

message ProductResponse { Product data = 1; }
message ListProductsResponse { repeated Product data = 1; int32 total = 2; }

message VariantInput {
  string sku = 1;
  map<string, string> options = 2;
  optional double priceOverride = 3;
  optional int32 stockQuantity = 4;
  optional bool active = 5;
  optional int32 sortOrder = 6;
}

message VariantPatch {
  optional string sku = 1;
  map<string, string> options = 2;
  optional double priceOverride = 3;
  bool clearPriceOverride = 4;
  optional int32 stockQuantity = 5;
  optional bool active = 6;
  optional int32 sortOrder = 7;
  bool replaceOptions = 8;
}

message CreateVariantRequest { string productId = 1; int32 expectedVersion = 2; VariantInput data = 3; }
message UpdateVariantRequest { string productId = 1; string variantId = 2; int32 expectedVersion = 3; VariantPatch data = 4; }
message DeleteVariantRequest { string productId = 1; string variantId = 2; int32 expectedVersion = 3; }

message ApplyDiscountBulkRequest {
  repeated string ids = 1; // specific targets (optional)
  string categoryId = 2;   // or select by category
  string status = 3;       // optional filter
  string q = 4;            // search title/sku

  string discountType = 10;  // "PERCENTAGE"|"FIXED"|"NONE"
  double discountValue = 11; // ignored if NONE
  bool   discountActive = 12;
  string discountStart = 13;
  string discountEnd = 14;
}

message BulkResult { int32 updated = 1; }

message GalleryImage {
  string id   = 1;
  string url  = 2;
  string alt  = 3;
  int32  sort = 4; // maps to sortOrder
  string deletedAt = 5; // ISO-8601 string; always empty on public reads
  string mediaId = 6;
  string title = 7;
  optional string altOverride = 8;
  optional string titleOverride = 9;
  int32 metadataVersion = 10;
}

message NewImage {
  string url  = 1;
  optional string alt  = 2;
  optional int32 sort = 3; // if absent, Product appends after current active images
  string mediaId = 4;
  optional string title = 5;
}

message UpdateImageMetadataRequest {
  string productId = 1;
  string imageId = 2;
  int32 expectedVersion = 3;
  optional string title = 4;
  optional string alt = 5;
  bool clearTitle = 6;
  bool clearAlt = 7;
}

message AddImagesRequest {
  string productId = 1;
  repeated NewImage images = 2;
}

message ListGalleryRequest {
  string productId = 1;
  bool   includeDeleted = 2 [deprecated = true]; // retained for wire compatibility; public reads ignore it
}

message AdminListGalleryRequest {
  string productId = 1;
  bool   includeDeleted = 2;
}

message ImageOrder {
  string id   = 1;
  int32  sort = 2;
}

message ReorderImagesRequest {
  string productId = 1;
  repeated ImageOrder orders = 2; // set new sort values
}

message RemoveImageRequest {
  string productId = 1;
  string imageId   = 2;
  bool   hardDelete = 3; // default false => soft delete
}

message GalleryResponse {
  string productId = 1;
  repeated GalleryImage images = 2;
}

// -----------------------------------------
// Service
// -----------------------------------------
// Internal checkout ownership: only signed Order service may call these methods.
message CheckoutStockLine {
  string productId = 1;
  string variantId = 2; // empty for a base selection
  int32 quantity = 3;
  int32 expectedVersion = 4;
  string sku = 5;
  string unitPrice = 6; // exact Decimal(18,2) amount, including discount
  map<string, string> selectedOptions = 7;
}
message ReserveCheckoutStockRequest {
  string intentId = 1;
  string payloadHash = 2;
  string currency = 3;
  repeated CheckoutStockLine lines = 4;
}
message CheckoutStockIdentity {
  string intentId = 1;
  string payloadHash = 2;
}
message CheckoutStockResponse {
  string intentId = 1;
  string payloadHash = 2;
  string state = 3; // HELD | FINALIZED | CANCELLED; RESTORED only for RestoreCheckoutStock
}

service ProductService {
  rpc ReserveCheckoutStock(ReserveCheckoutStockRequest) returns (CheckoutStockResponse);
  rpc FinalizeCheckoutStock(CheckoutStockIdentity) returns (CheckoutStockResponse);
  rpc CancelCheckoutStock(CheckoutStockIdentity) returns (CheckoutStockResponse);
  rpc RestoreCheckoutStock(CheckoutStockIdentity) returns (CheckoutStockResponse);
  rpc UpdateImageMetadata(UpdateImageMetadataRequest) returns (GalleryResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc CreateProductV3 (CreateProductRequest) returns (ProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc UpdateProductV3 (UpdateProductRequest) returns (ProductResponse);
  rpc GetProduct    (GetProductRequest)    returns (ProductResponse);
  rpc ListProducts  (ListProductsRequest)  returns (ListProductsResponse);
  rpc AdminGetProduct   (GetProductRequest)          returns (ProductResponse);
  rpc AdminGetProductV3 (GetProductRequest)          returns (ProductResponse);
  rpc AdminListProducts (AdminListProductsRequest)   returns (ListProductsResponse);
  rpc AdminListProductsV3 (AdminListProductsRequest) returns (ListProductsResponse);
  rpc CreateVariant (CreateVariantRequest) returns (ProductResponse);
  rpc CreateVariantV3 (CreateVariantRequest) returns (ProductResponse);
  rpc UpdateVariant (UpdateVariantRequest) returns (ProductResponse);
  rpc UpdateVariantV3 (UpdateVariantRequest) returns (ProductResponse);
  rpc DeleteVariant (DeleteVariantRequest) returns (ProductResponse);
  rpc DeleteVariantV3 (DeleteVariantRequest) returns (ProductResponse);

  rpc DeleteProduct      (DeleteProductRequest)      returns (ProductResponse); // soft
  rpc DeleteProductV3    (DeleteProductRequest)      returns (ProductResponse);
  rpc RestoreProduct     (RestoreProductRequest)     returns (ProductResponse);
  rpc RestoreProductV3   (RestoreProductRequest)     returns (ProductResponse);
  rpc HardDeleteProduct  (HardDeleteProductRequest)  returns (ProductResponse);
  rpc HardDeleteProductV3(HardDeleteProductRequest)  returns (ProductResponse);

  rpc ApplyDiscountBulk (ApplyDiscountBulkRequest) returns (BulkResult);
  rpc ApplyDiscountBulkV3(ApplyDiscountBulkRequest) returns (BulkResult);

  rpc AddImages     (AddImagesRequest)     returns (GalleryResponse);
  rpc AddImagesV3   (AddImagesRequest)     returns (GalleryResponse);
  rpc ListGallery   (ListGalleryRequest)   returns (GalleryResponse);
  rpc AdminListGallery (AdminListGalleryRequest) returns (GalleryResponse);
  rpc AdminListGalleryV3(AdminListGalleryRequest) returns (GalleryResponse);
  rpc ReorderImages (ReorderImagesRequest) returns (GalleryResponse);
  rpc ReorderImagesV3(ReorderImagesRequest) returns (GalleryResponse);
  rpc RemoveImage   (RemoveImageRequest)   returns (GalleryResponse);
  rpc RemoveImageV3 (RemoveImageRequest)   returns (GalleryResponse);
}


// -----------------------------------------
// Product Taxonomy DTOs (proxying taxonomy-service)
// -----------------------------------------
message ProductTaxonomy {
  string id          = 1;
  string scope       = 2;
  string kind        = 3;
  string slug        = 4;
  string title       = 5;
  string description = 6;
  string parentId    = 7;
  string path        = 8;
  bool   isHidden    = 9;
  bool   isSystem    = 10;
  int32  sortOrder   = 11;
  bool   hasChildren = 12;

  string createdAt   = 13;
  string updatedAt   = 14;
}

message ProductTaxonomyResponse {
  ProductTaxonomy data = 1;
}

message ListProductTaxonomiesRequest {
  string kind     = 1; // e.g. "category.default", "brand", "tag"
  int32  page     = 2;
  int32  limit    = 3;
  string q        = 4;
  string parentId = 5; // optional: filter by parent
}

message ListProductTaxonomiesResponse {
  repeated ProductTaxonomy data = 1;
  int32 page                    = 2;
  int32 limit                   = 3;
  int32 total                   = 4;
}

message GetProductTaxonomyRequest {
  string id = 1;
}

message CreateProductTaxonomyRequest {
  string kind        = 1; // which taxonomy kind we are creating in
  string slug        = 2;
  string title       = 3;
  string description = 4;
  string parentId    = 5;
  bool   isHidden    = 6;
  int32  sortOrder   = 7;
}

message UpdateProductTaxonomyRequest {
  string id          = 1;
  string slug        = 2;
  string title       = 3;
  string description = 4;
  string parentId    = 5;
  bool   isHidden    = 6;
  int32  sortOrder   = 7;
}

message DeleteProductTaxonomyRequest {
  string id = 1;
}

message DeleteProductTaxonomyResponse {
  bool success = 1;
}

// -----------------------------------------
// ProductTaxonomyService – exposed by product-service
// but backed by taxonomy-service
// -----------------------------------------
service ProductTaxonomyService {
  rpc List   (ListProductTaxonomiesRequest)   returns (ListProductTaxonomiesResponse);
  rpc Get    (GetProductTaxonomyRequest)      returns (ProductTaxonomyResponse);
  rpc Create (CreateProductTaxonomyRequest)   returns (ProductTaxonomyResponse);
  rpc CreateV3(CreateProductTaxonomyRequest)  returns (ProductTaxonomyResponse);
  rpc Update (UpdateProductTaxonomyRequest)   returns (ProductTaxonomyResponse);
  rpc UpdateV3(UpdateProductTaxonomyRequest)  returns (ProductTaxonomyResponse);
  rpc Delete (DeleteProductTaxonomyRequest)   returns (DeleteProductTaxonomyResponse);
  rpc DeleteV3(DeleteProductTaxonomyRequest)  returns (DeleteProductTaxonomyResponse);
}
