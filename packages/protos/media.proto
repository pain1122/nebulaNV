syntax = "proto3";

package media;

message Empty {}

message Pong {
  string message = 1;
}

// ---- Core DTOs ----

message Media {
  string id = 1;

  // storage
  string storage = 2;   // local|s3|minio|r2...
  string bucket = 3;    // optional
  string path = 4;
  string filename = 5;
  string mimeType = 6;
  string sizeBytes = 7; // numeric string

  // optional meta
  int32 width = 8;
  int32 height = 9;
  int32 durationSec = 10;

  // ownership + access
  string ownerId = 11;     // uuid or empty
  string visibility = 12;  // private|public
  string scope = 13;       // panel|user|system

  // integrity
  string sha256 = 14;

  string createdAt = 15; // ISO string
  string updatedAt = 16; // ISO string

  // ---- lifecycle / security ----
  // PENDING|READY|QUARANTINED|DELETED (you decide exact enum-like strings)
  string status = 17;

  // PENDING|CLEAN|INFECTED|FAILED
  string scanStatus = 18;

  // optional details
  string quarantineReason = 19;

  // storage metadata (optional)
  string etag = 20;
  string promotedAt = 21;
  string accessClass = 22; // PUBLIC|PROTECTED|STRICT
  string folderPath = 23; // filemanager folder, e.g. /images/products
  string displayName = 24; // admin-facing file name in folder
  string originalFilename = 25; // original client filename when known
  string entityType = 26; // product|order|passport|...
  string entityId = 27;   // feature/business entity id
}

// ---- RPCs ----

message CreateReq {
  string storage = 1;
  string bucket = 2;
  string path = 3;
  string filename = 4;
  string mimeType = 5;
  string sizeBytes = 6;

  int32 width = 7;
  int32 height = 8;
  int32 durationSec = 9;

  string ownerId = 10;
  string visibility = 11;
  string scope = 12;

  string sha256 = 13;
  string accessClass = 14; // optional
  string folderPath = 15;
  string displayName = 16;
  string originalFilename = 17;
  string entityType = 18;
  string entityId = 19;
}

message MediaRes {
  Media media = 1;
}

message GetByIdReq {
  string id = 1;
}

message ListReq {
  string q = 1;
  int32 take = 2;
  int32 skip = 3;

  // optional filtering (future-proof)
  string ownerId = 4;
  string visibility = 5;
  string scope = 6;

  // optional lifecycle filtering
  string status = 7;
  string scanStatus = 8;
  string accessClass = 9; // optional
  string folderPath = 10;
  string entityType = 11;
  string entityId = 12;
  string search = 13;
  string path = 14;
  string mimeType = 15;
  string mediaType = 16;
  string sortBy = 17;
  string order = 18;
}

message ListRes {
  repeated Media items = 1;
}

message DeleteByIdReq {
  string id = 1;
}

message DeleteRes {
  bool deleted = 1;
}

message ReadUrlReq {
  string id = 1;
  bool download = 2;
}

message ReadUrlRes {
  string url = 1;
  int32 expiresIn = 2;
  string accessClass = 3;
  string filename = 4;
  string mimeType = 5;
}

// User-owned protected lane. Owner, access class, and visibility are derived
// from verified actor context and therefore do not exist in these requests.
message ListMyProtectedLibraryReq {
  string q = 1;
  int32 take = 2;
  int32 skip = 3;
  string scope = 4;
  string status = 5;
  string scanStatus = 6;
  string folderPath = 7;
  string entityType = 8;
  string entityId = 9;
  string search = 10;
  string path = 11;
  string mimeType = 12;
  string mediaType = 13;
  string sortBy = 14;
  string order = 15;
}

message CreateMyProtectedReadUrlReq {
  string id = 1;
  string scope = 2;
  string entityType = 3;
  string entityId = 4;
  bool download = 5;
}

message PublicLibraryDeleteItem {
  string type = 1; // file|folder
  string id = 2; // required for file
  string folderPath = 3; // required for folder
}

message PreviewPublicLibraryDeleteReq {
  repeated PublicLibraryDeleteItem items = 1;
  bool recursive = 2;
  string scope = 3;
}

message ConfirmPublicLibraryDeleteReq {
  repeated PublicLibraryDeleteItem items = 1;
  bool recursive = 2;
  string scope = 3;
  string confirmToken = 4;
}

message PublicLibraryDeleteWarning {
  string code = 1;
  string folderPath = 2;
  int32 fileCount = 3;
  int32 limit = 4;
}

message PublicLibraryDeleteFolder {
  string type = 1;
  string folderPath = 2;
  int32 fileCount = 3;
}

message PublicLibraryDeleteFile {
  string type = 1;
  string id = 2;
  string folderPath = 3;
  string displayName = 4;
  string path = 5;
  string sizeBytes = 6;
  string mimeType = 7;
}

message PreviewPublicLibraryDeleteRes {
  string scope = 1;
  bool recursive = 2;
  bool canDelete = 3;
  repeated PublicLibraryDeleteWarning warnings = 4;
  int32 fileCount = 5;
  int32 folderCount = 6;
  string totalSizeBytes = 7;
  repeated PublicLibraryDeleteFolder folders = 8;
  repeated PublicLibraryDeleteFile files = 9;
  string confirmToken = 10;
  int32 expiresIn = 11;
}

message ConfirmPublicLibraryDeleteRes {
  bool deleted = 1;
  int32 fileCount = 2;
  int32 folderCount = 3;
  string totalSizeBytes = 4;
}

// ---- Presign / Finalize ----

message PresignUploadReq {
  string filename = 1;
  string mimeType = 2;
  string ownerId = 3;
  string visibility = 4;
  string scope = 5;
  string accessClass = 6; // optional
  string folderPath = 7;
  string displayName = 8;
  string entityType = 9;
  string entityId = 10;
}

message PresignUploadRes {
  string storage = 1;
  string bucket = 2;
  string path = 3;
  string uploadUrl = 4;
  int32 expiresIn = 5;

  string filename = 6;
  string mimeType = 7;
  string visibility = 8;
  string scope = 9;
  string accessClass = 10; // resolved class
  string folderPath = 11;
  string displayName = 12;
  string originalFilename = 13;
  string entityType = 14;
  string entityId = 15;
  string ownerId = 16;
}

message FinalizeUploadReq {
  // must match what presign returned (pending path)
  string storage = 1;   // usually "s3"
  string bucket = 2;
  string path = 3;

  // client-provided metadata (not trusted; used as hints)
  string filename = 4;
  string mimeType = 5;
  string visibility = 6;
  string scope = 7;

  // optional
  string ownerId = 8;
  string sha256 = 9; // if client computed; optional
  string accessClass = 10; // optional
  string folderPath = 11;
  string displayName = 12;
  string originalFilename = 13;
  string entityType = 14;
  string entityId = 15;
}

service MediaService {
  rpc Ping(Empty) returns (Pong);

  // legacy (we'll stop using it in tests later, but keep for compatibility)
  rpc Create(CreateReq) returns (MediaRes);

  rpc GetById(GetByIdReq) returns (MediaRes);
  rpc GetByIdV3(GetByIdReq) returns (MediaRes);
  rpc List(ListReq) returns (ListRes);
  rpc DeleteById(DeleteByIdReq) returns (DeleteRes);

  rpc PresignUpload(PresignUploadReq) returns (PresignUploadRes);
  rpc FinalizeUpload(FinalizeUploadReq) returns (MediaRes);

  // Explicit lane families for filemanager/backend jobs.
  rpc ListPublicLibrary(ListReq) returns (ListRes);
  rpc ListPublicLibraryV3(ListReq) returns (ListRes);
  rpc ListProtectedLibrary(ListReq) returns (ListRes);
  rpc ListProtectedLibraryV3(ListReq) returns (ListRes);
  rpc ListStrictLibrary(ListReq) returns (ListRes);
  rpc ListStrictLibraryV3(ListReq) returns (ListRes);
  rpc ListMyProtectedLibrary(ListMyProtectedLibraryReq) returns (ListRes);
  rpc ListMyProtectedLibraryV3(ListMyProtectedLibraryReq) returns (ListRes);

  rpc PresignPublicLibraryUpload(PresignUploadReq) returns (PresignUploadRes);
  rpc PresignPublicLibraryUploadV3(PresignUploadReq) returns (PresignUploadRes);
  rpc PresignProtectedLibraryUpload(PresignUploadReq) returns (PresignUploadRes);
  rpc PresignProtectedLibraryUploadV3(PresignUploadReq) returns (PresignUploadRes);
  rpc PresignStrictLibraryUpload(PresignUploadReq) returns (PresignUploadRes);
  rpc PresignStrictLibraryUploadV3(PresignUploadReq) returns (PresignUploadRes);

  rpc FinalizePublicLibraryUpload(FinalizeUploadReq) returns (MediaRes);
  rpc FinalizePublicLibraryUploadV3(FinalizeUploadReq) returns (MediaRes);
  rpc FinalizeProtectedLibraryUpload(FinalizeUploadReq) returns (MediaRes);
  rpc FinalizeProtectedLibraryUploadV3(FinalizeUploadReq) returns (MediaRes);
  rpc FinalizeStrictLibraryUpload(FinalizeUploadReq) returns (MediaRes);
  rpc FinalizeStrictLibraryUploadV3(FinalizeUploadReq) returns (MediaRes);

  rpc CreatePublicLibraryReadUrl(ReadUrlReq) returns (ReadUrlRes);
  rpc CreatePublicLibraryReadUrlV3(ReadUrlReq) returns (ReadUrlRes);
  rpc CreateProtectedLibraryReadUrl(ReadUrlReq) returns (ReadUrlRes);
  rpc CreateProtectedLibraryReadUrlV3(ReadUrlReq) returns (ReadUrlRes);
  rpc CreateStrictLibraryReadUrl(ReadUrlReq) returns (ReadUrlRes);
  rpc CreateStrictLibraryReadUrlV3(ReadUrlReq) returns (ReadUrlRes);
  rpc CreateMyProtectedReadUrl(CreateMyProtectedReadUrlReq) returns (ReadUrlRes);
  rpc CreateMyProtectedReadUrlV3(CreateMyProtectedReadUrlReq) returns (ReadUrlRes);

  rpc DeletePublicLibraryById(DeleteByIdReq) returns (DeleteRes);
  rpc DeleteProtectedLibraryById(DeleteByIdReq) returns (DeleteRes);
  rpc DeleteProtectedLibraryByIdV3(DeleteByIdReq) returns (DeleteRes);
  rpc DeleteStrictLibraryById(DeleteByIdReq) returns (DeleteRes);
  rpc DeleteStrictLibraryByIdV3(DeleteByIdReq) returns (DeleteRes);

  rpc PreviewPublicLibraryDelete(PreviewPublicLibraryDeleteReq) returns (PreviewPublicLibraryDeleteRes);
  rpc PreviewPublicLibraryDeleteV3(PreviewPublicLibraryDeleteReq) returns (PreviewPublicLibraryDeleteRes);
  rpc ConfirmPublicLibraryDelete(ConfirmPublicLibraryDeleteReq) returns (ConfirmPublicLibraryDeleteRes);
  rpc ConfirmPublicLibraryDeleteV3(ConfirmPublicLibraryDeleteReq) returns (ConfirmPublicLibraryDeleteRes);
}
