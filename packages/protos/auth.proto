syntax = "proto3";

package auth;

import "user.proto";

service AuthService {
  rpc Register       (RegisterRequest)       returns (RegisterResponse);
  rpc ValidateUser   (ValidateUserRequest)   returns (ValidateUserResponse);
  rpc GetTokens      (GetTokensRequest)      returns (GetTokensResponse);
  rpc RefreshTokens  (RefreshTokensRequest)  returns (GetTokensResponse);
  rpc RefreshTokensV3(RefreshTokensRequest)  returns (GetTokensResponse);
  rpc Logout         (LogoutRequest)         returns (LogoutResponse);
  rpc LogoutV3       (LogoutRequest)         returns (LogoutResponse);
  rpc ValidateToken  (ValidateTokenRequest)  returns (ValidateTokenResponse);

  rpc GetProfile (GetProfileRequest) returns (user.UserResponse);
  rpc GetProfileV3(GetProfileRequest) returns (user.UserResponse);
}

message RegisterRequest {
  string email    = 1;
  string password = 2;
}

message RegisterResponse {
  string id    = 1;
  string email = 2;
  string role  = 3;
}

message ValidateUserRequest {
  string identifier = 1; // email or phone
  string password   = 2;
}

message ValidateUserResponse {
  bool   isValid = 1;
  string userId  = 2;
}

message GetTokensRequest {
  string userId = 1;
}

message RefreshTokensRequest {
  string refreshToken = 1;
}

message GetTokensResponse {
  string accessToken            = 1;
  string refreshToken           = 2;
  int32 accessExpiresInSeconds  = 3;
  int32 refreshExpiresInSeconds = 4;
}

message LogoutRequest {
  bool   allDevices  = 1;
  string refreshToken = 2;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   isValid = 1;
  string userId  = 2;
  string email   = 3;
  string role    = 4;
  string sessionRef = 5; // non-secret HMAC reference; never the raw session id
}

message GetProfileRequest {
  string userId = 1;
}
