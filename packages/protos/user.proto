// user.proto - gRPC contract for UserService
syntax = "proto3";
package user;

service UserService {
  rpc FindUser            (FindUserRequest) returns (UserResponse);
  rpc GetUser             (GetUserRequest)  returns (UserResponse);
  rpc ListUsers           (ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateProfile       (UpdateProfileRequest)       returns (UserResponse);
  rpc CreateUser          (CreateUserRequest)          returns (UserResponse);
  rpc FindUserWithHash    (FindUserWithHashRequest)    returns (FindUserWithHashResponse);
  rpc GetUserWithHash     (GetUserWithHashRequest) returns (GetUserWithHashResponse);
}

message FindUserRequest {
  oneof identifier {
    string email = 1;
    string phone = 2;   // E.164 format, e.g. "+994501234567"
  }
}

// Request message for fetching a user by ID
message GetUserRequest {
string id = 1;        // The UUID of the user to fetch
}

// Response message representing a User
message UserResponse {
string id    = 1;     // Unique identifier of the user
string email = 2;     // Email address
string role  = 3;     // Role (e.g., "user", "admin")
}

// Current admin list contract. It is intentionally unpaginated and never
// exposes password hashes or other authentication material.
message ListUsersRequest {}

message ListUsersResponse {
  repeated UserListItem users = 1;
}

message UserListItem {
  string id        = 1;
  string email     = 2;
  string phone     = 3;
  string role      = 4;
  string createdAt = 5; // ISO-8601 string
}

// Request message for updating a profile
message UpdateProfileRequest {
string id              = 1; // The UUID of the user making the update
// Only include fields if they should be updated
string email           = 2;
string newPassword     = 3;
string currentPassword = 4;
}
// New messages below:
message CreateUserRequest {
  string email    = 1;
  string password = 2; // hashed
  string role     = 3;
}

message FindUserWithHashRequest {
  oneof identifier {
    string email = 1;
    string phone = 2;
  }
}

message FindUserWithHashResponse {
  reserved 5;
  reserved "refreshToken";

  string id           = 1;
  string email        = 2;
  string role         = 3;
  string passwordHash = 4;
}


message GetUserWithHashRequest {
  string id = 1;
}

message GetUserWithHashResponse {
  reserved 5;
  reserved "refreshToken";

  string id = 1;
  string email = 2;
  string role = 3;
  string passwordHash = 4;
}
