x-internal-targets: &internal-targets
  USER_GRPC_URL: user-service:50051
  AUTH_GRPC_URL: auth-service:50052
  PRODUCT_GRPC_URL: product-service:50053
  SETTINGS_GRPC_URL: settings-service:50054
  BLOG_GRPC_URL: blog-service:50055
  ORDER_GRPC_URL: order-service:50056
  TAXONOMY_GRPC_URL: taxonomy-service:50057
  MEDIA_GRPC_URL: media-service:50058
  TENANT_AUTHORITY_GRPC_URL: tenant-authority-service:50059

x-internal-grpc: &internal-grpc
  <<: *internal-targets
  S2S_REPLAY_STORE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}
services:
  # 🐘 PostgreSQL (shared across services)
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nebula
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  tenant-authority-db-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      AUTHORITY_DB_RUNTIME_PASSWORD: ${AUTHORITY_DB_RUNTIME_PASSWORD:-dev-only-authority-runtime-password}
    volumes:
      - ./scripts/db/ensure-tenant-authority-db.sh:/scripts/ensure-tenant-authority-db.sh:ro
    entrypoint: ["bash", "/scripts/ensure-tenant-authority-db.sh"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb -p local/media || true;
        exit 0;

  # 👤 User Service
  user-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-user-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: user-runtime
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/user-service/.env
    ports:
      - "3100:3100"
      - "50051:50051"
    environment:
      <<: *internal-grpc
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_users?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_users_shadow

  # 🔐 Auth Service
  auth-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-auth-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: auth-runtime
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/auth-service/.env
    environment:
      <<: *internal-grpc
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      USER_GRPC_URL: user-service:50051
    ports:
      - "3001:3001"
      - "50052:50052"

  # Authority persistence foundation. Batch 2 item 1 exposes health only;
  # gateway traffic remains on StaticApplicationRegistry at G0_F3_BASELINE.
  tenant-authority-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-tenant-authority-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: tenant-authority-runtime
    container_name: tenant-authority-service
    depends_on:
      tenant-authority-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SVC_NAME: tenant-authority-service
      PUBLIC_MODE: GATEWAY_ONLY
      PORT: 3011
      GRPC_PORT: 50059
      AUTH_GRPC_URL: auth-service:50052
      S2S_REPLAY_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      S2S_OUTBOUND_KEYS: "{}"
      S2S_INBOUND_KEYS: "{}"
      GATEWAY_INBOUND_KEYS: '{"gateway":{"current":{"id":"gateway-tenant-authority-v1","secret":"dev-only-gateway-to-tenant-authority-key-0001"}}}'
      AUTHORITY_AUDIT_HMAC_KEY_ID: authority-audit-dev-v1
      AUTHORITY_AUDIT_HMAC_KEY: dev-only-authority-audit-hmac-key-00000001
      AUTHORITY_MEMBERSHIP_EPOCH_HMAC_KEY_ID: authority-membership-epoch-dev-v1
      AUTHORITY_MEMBERSHIP_EPOCH_HMAC_KEY: dev-only-membership-epoch-hmac-key-000001
      DATABASE_URL: "postgresql://nebula_authority_runtime:${AUTHORITY_DB_RUNTIME_PASSWORD:-dev-only-authority-runtime-password}@postgres:5432/nebula_authority?schema=public"
    ports:
      - "3011:3011"
      - "50059:50059"

  # 🛒 Product Service
  product-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-product-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: product-runtime
    container_name: product-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      taxonomy-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/product-service/.env
    environment:
      <<: *internal-grpc
      AUTH_GRPC_URL: auth-service:50052
      SETTINGS_GRPC_URL: settings-service:50054
      TAXONOMY_GRPC_URL: taxonomy-service:50057
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_products?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_products_shadow
    ports:
      - "3003:3003"
      - "50053:50053"

  # ⚙️ Settings Service
  settings-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-settings-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: settings-runtime
    container_name: settings-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/settings-service/.env
    ports:
      - "3010:3010"
      - "50054:50054"
    environment:
      <<: *internal-grpc
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_settings?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_settings_shadow

  taxonomy-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-taxonomy-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: taxonomy-runtime
    container_name: taxonomy-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/taxonomy-service/.env
    environment:
      <<: *internal-grpc
      AUTH_GRPC_URL: auth-service:50052
      SETTINGS_GRPC_URL: settings-service:50054
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_taxonomy?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_taxonomy_shadow
    ports:
      - "3006:3006"
      - "50057:50057"

  blog-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-blog-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: blog-runtime
    container_name: blog-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      taxonomy-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/blog-service/.env
    environment:
      <<: *internal-grpc
      AUTH_GRPC_URL: auth-service:50052
      SETTINGS_GRPC_URL: settings-service:50054
      TAXONOMY_GRPC_URL: taxonomy-service:50057
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_blog?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_blog_shadow
    ports:
      - "3004:3004"
      - "50055:50055"

  order-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-order-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: order-runtime
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/order-service/.env
    environment:
      <<: *internal-grpc
      AUTH_GRPC_URL: auth-service:50052
      SETTINGS_GRPC_URL: settings-service:50054
      PRODUCT_GRPC_URL: product-service:50053
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_order?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_order_shadow
    ports:
      - "3005:3005"
      - "50056:50056"

  media-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-media-service:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: media-runtime
    container_name: media-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
      - apps/media-service/.env
    environment:
      <<: *internal-grpc
      AUTH_GRPC_URL: auth-service:50052
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nebula_media?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=nebula_media_shadow
      MEDIA_STORAGE_PROVIDER: minio
      MEDIA_STORAGE_DRIVER: s3
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_INTERNAL_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_BUCKET: media
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MEDIA_S3_FORCE_PATH_STYLE: "true"
      MEDIA_SIGNED_UPLOAD_TTL_SECONDS: 600
      MEDIA_SIGNED_READ_TTL_SECONDS: 300
      MEDIA_STRICT_READ_TTL_SECONDS: 30
      MEDIA_SYNC_DELETE_MAX_FILES: 500
      MEDIA_PUBLIC_FOLDER: uploads
      MEDIA_PRIVATE_FOLDER: private/objects
    ports:
      - "3007:3007"
      - "50058:50058"

  gateway:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-gateway:${NEBULA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: gateway-runtime
    container_name: gateway
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/gateway/.env
    ports:
      - "3002:3002"
    environment:
      <<: *internal-targets
      GATEWAY_HTTP_PORT: 3002
      GATEWAY_REDIS_URL: redis://redis:6379/0
      MEDIA_RENDER_HTTP_URL: ${MEDIA_RENDER_HTTP_URL:-http://media-service:3007}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio-data:
