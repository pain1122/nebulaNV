x-internal-targets: &internal-targets
  USER_GRPC_URL: user-service:50051
  AUTH_GRPC_URL: auth-service:50052
  PRODUCT_GRPC_URL: product-service:50053
  SETTINGS_GRPC_URL: settings-service:50054
  BLOG_GRPC_URL: blog-service:50055
  ORDER_GRPC_URL: order-service:50056
  TAXONOMY_GRPC_URL: taxonomy-service:50057
  MEDIA_GRPC_URL: media-service:50058
  TENANT_AUTHORITY_GRPC_URL: tenant-authority-service:50059

x-internal-grpc: &internal-grpc
  <<: *internal-targets

x-common-service-env: &common-service-env
  NODE_ENV: ${NODE_ENV:-production}
  PUBLIC_MODE: ${PUBLIC_MODE:-GATEWAY_ONLY}
  S2S_SIGNATURE_HEADER: ${S2S_SIGNATURE_HEADER:-x-s2s-signature}
  S2S_MAX_CLOCK_SKEW_MS: ${S2S_MAX_CLOCK_SKEW_MS:-30000}
  S2S_REPLAY_STORE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nebula}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  tenant-authority-db-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTHORITY_DB_RUNTIME_PASSWORD: ${AUTHORITY_DB_RUNTIME_PASSWORD:?AUTHORITY_DB_RUNTIME_PASSWORD is required}
    volumes:
      - ./scripts/db/ensure-tenant-authority-db.sh:/scripts/ensure-tenant-authority-db.sh:ro
    entrypoint: ["bash", "/scripts/ensure-tenant-authority-db.sh"]

  realm-auth-db-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REALM_AUTH_DEFAULT_DB_RUNTIME_PASSWORD: ${REALM_AUTH_DEFAULT_DB_RUNTIME_PASSWORD:?REALM_AUTH_DEFAULT_DB_RUNTIME_PASSWORD is required}
      REALM_AUTH_OPERATOR_DB_RUNTIME_PASSWORD: ${REALM_AUTH_OPERATOR_DB_RUNTIME_PASSWORD:?REALM_AUTH_OPERATOR_DB_RUNTIME_PASSWORD is required}
    volumes:
      - ./scripts/db/ensure-realm-auth-dbs.sh:/scripts/ensure-realm-auth-dbs.sh:ro
    entrypoint: ["bash", "/scripts/ensure-realm-auth-dbs.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  realm-auth-default-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REALM_AUTH_DEFAULT_REDIS_PASSWORD:?REALM_AUTH_DEFAULT_REDIS_PASSWORD is required}",
      ]
    environment:
      REDISCLI_AUTH: ${REALM_AUTH_DEFAULT_REDIS_PASSWORD:?REALM_AUTH_DEFAULT_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  realm-auth-operator-redis:
    profiles: ["r3-shadow"]
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REALM_AUTH_OPERATOR_REDIS_PASSWORD:?REALM_AUTH_OPERATOR_REDIS_PASSWORD is required}",
      ]
    environment:
      REDISCLI_AUTH: ${REALM_AUTH_OPERATOR_REDIS_PASSWORD:?REALM_AUTH_OPERATOR_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb -p "local/$MEDIA_S3_BUCKET" || true;
        exit 0;

  user-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-user-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: user-service
      S2S_OUTBOUND_KEYS: ${USER_S2S_OUTBOUND_KEYS:?USER_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${USER_S2S_INBOUND_KEYS:?USER_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${USER_GATEWAY_INBOUND_KEYS:?USER_GATEWAY_INBOUND_KEYS is required}
      PORT: 3100
      GRPC_PORT: 50051
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_users?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_users_shadow"

  auth-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-auth-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: auth-service
      S2S_OUTBOUND_KEYS: ${AUTH_S2S_OUTBOUND_KEYS:?AUTH_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${AUTH_S2S_INBOUND_KEYS:?AUTH_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${AUTH_GATEWAY_INBOUND_KEYS:?AUTH_GATEWAY_INBOUND_KEYS is required}
      PORT: 3001
      GRPC_PORT: 50052
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

  realm-auth-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-realm-auth-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      realm-auth-db-init:
        condition: service_completed_successfully
      realm-auth-default-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REALM_AUTH_DEPLOYMENT: DEFAULT
      REALM_AUTH_HTTP_PORT: 3012
      REALM_AUTH_IDENTITY_REALM_ID: b1000000-0000-4000-8000-000000000001
      REALM_AUTH_ROUTE_REF: b1100000-0000-4000-8000-000000000001
      REALM_AUTH_ISSUER: urn:nebula:realm-auth:b1000000-0000-4000-8000-000000000001
      REALM_AUTH_REDIS_URL: "redis://:${REALM_AUTH_DEFAULT_REDIS_PASSWORD:?REALM_AUTH_DEFAULT_REDIS_PASSWORD is required}@realm-auth-default-redis:6379/0"
      DATABASE_URL: "postgresql://nebula_realm_auth_default_runtime:${REALM_AUTH_DEFAULT_DB_RUNTIME_PASSWORD:?REALM_AUTH_DEFAULT_DB_RUNTIME_PASSWORD is required}@postgres:5432/nebula_realm_auth_default?schema=public"

  operator-realm-auth-service:
    profiles: ["r3-shadow"]
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-realm-auth-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      realm-auth-db-init:
        condition: service_completed_successfully
      realm-auth-operator-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REALM_AUTH_DEPLOYMENT: OPERATOR
      REALM_AUTH_HTTP_PORT: 3013
      REALM_AUTH_IDENTITY_REALM_ID: b1000000-0000-4000-8000-000000000002
      REALM_AUTH_ROUTE_REF: b1100000-0000-4000-8000-000000000002
      REALM_AUTH_ISSUER: urn:nebula:realm-auth:b1000000-0000-4000-8000-000000000002
      REALM_AUTH_REDIS_URL: "redis://:${REALM_AUTH_OPERATOR_REDIS_PASSWORD:?REALM_AUTH_OPERATOR_REDIS_PASSWORD is required}@realm-auth-operator-redis:6379/0"
      DATABASE_URL: "postgresql://nebula_realm_auth_operator_runtime:${REALM_AUTH_OPERATOR_DB_RUNTIME_PASSWORD:?REALM_AUTH_OPERATOR_DB_RUNTIME_PASSWORD is required}@postgres:5432/nebula_realm_auth_operator?schema=public"

  tenant-authority-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-tenant-authority-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      tenant-authority-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: tenant-authority-service
      S2S_OUTBOUND_KEYS: "{}"
      S2S_INBOUND_KEYS: ${TENANT_AUTHORITY_S2S_INBOUND_KEYS:?TENANT_AUTHORITY_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${TENANT_AUTHORITY_GATEWAY_INBOUND_KEYS:?TENANT_AUTHORITY_GATEWAY_INBOUND_KEYS is required}
      AUTHORITY_AUDIT_HMAC_KEY_ID: ${AUTHORITY_AUDIT_HMAC_KEY_ID:?AUTHORITY_AUDIT_HMAC_KEY_ID is required}
      AUTHORITY_AUDIT_HMAC_KEY: ${AUTHORITY_AUDIT_HMAC_KEY:?AUTHORITY_AUDIT_HMAC_KEY is required}
      PORT: 3011
      GRPC_PORT: 50059
      DATABASE_URL: "postgresql://nebula_authority_runtime:${AUTHORITY_DB_RUNTIME_PASSWORD:?AUTHORITY_DB_RUNTIME_PASSWORD is required}@postgres:5432/nebula_authority?schema=public"

  settings-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-settings-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: settings-service
      S2S_OUTBOUND_KEYS: ${SETTINGS_S2S_OUTBOUND_KEYS:?SETTINGS_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${SETTINGS_S2S_INBOUND_KEYS:?SETTINGS_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${SETTINGS_GATEWAY_INBOUND_KEYS:?SETTINGS_GATEWAY_INBOUND_KEYS is required}
      PORT: 3010
      GRPC_PORT: 50054
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_settings?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_settings_shadow"

  taxonomy-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-taxonomy-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: taxonomy-service
      S2S_OUTBOUND_KEYS: ${TAXONOMY_S2S_OUTBOUND_KEYS:?TAXONOMY_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${TAXONOMY_S2S_INBOUND_KEYS:?TAXONOMY_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${TAXONOMY_GATEWAY_INBOUND_KEYS:?TAXONOMY_GATEWAY_INBOUND_KEYS is required}
      PORT: 3006
      GRPC_PORT: 50057
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_taxonomy?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_taxonomy_shadow"

  product-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-product-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      taxonomy-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: product-service
      S2S_OUTBOUND_KEYS: ${PRODUCT_S2S_OUTBOUND_KEYS:?PRODUCT_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${PRODUCT_S2S_INBOUND_KEYS:?PRODUCT_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${PRODUCT_GATEWAY_INBOUND_KEYS:?PRODUCT_GATEWAY_INBOUND_KEYS is required}
      PORT: 3003
      GRPC_PORT: 50053
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_products?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_products_shadow"

  blog-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-blog-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      taxonomy-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: blog-service
      S2S_OUTBOUND_KEYS: ${BLOG_S2S_OUTBOUND_KEYS:?BLOG_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${BLOG_S2S_INBOUND_KEYS:?BLOG_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${BLOG_GATEWAY_INBOUND_KEYS:?BLOG_GATEWAY_INBOUND_KEYS is required}
      PORT: 3004
      GRPC_PORT: 50055
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_blog?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_blog_shadow"

  order-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-order-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      settings-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      SVC_NAME: order-service
      S2S_OUTBOUND_KEYS: ${ORDER_S2S_OUTBOUND_KEYS:?ORDER_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${ORDER_S2S_INBOUND_KEYS:?ORDER_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${ORDER_GATEWAY_INBOUND_KEYS:?ORDER_GATEWAY_INBOUND_KEYS is required}
      PORT: 3005
      GRPC_PORT: 50056
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_order?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_order_shadow"

  media-service:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-media-service:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: [*common-service-env, *internal-grpc]
      PUBLIC_MODE: OPEN
      SVC_NAME: media-service
      S2S_OUTBOUND_KEYS: ${MEDIA_S2S_OUTBOUND_KEYS:?MEDIA_S2S_OUTBOUND_KEYS is required}
      S2S_INBOUND_KEYS: ${MEDIA_S2S_INBOUND_KEYS:?MEDIA_S2S_INBOUND_KEYS is required}
      GATEWAY_INBOUND_KEYS: ${MEDIA_GATEWAY_INBOUND_KEYS:?MEDIA_GATEWAY_INBOUND_KEYS is required}
      MEDIA_DELETE_CONFIRM_SECRET: ${MEDIA_DELETE_CONFIRM_SECRET:?MEDIA_DELETE_CONFIRM_SECRET is required}
      PORT: 3007
      GRPC_PORT: 50058
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nebula_media?schema=public"
      SHADOW_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?schema=nebula_media_shadow"
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-minio}
      MEDIA_STORAGE_DRIVER: s3
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_INTERNAL_ENDPOINT:-http://minio:9000}
      MEDIA_S3_INTERNAL_ENDPOINT: ${MEDIA_S3_INTERNAL_ENDPOINT:-http://minio:9000}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:?MEDIA_S3_PUBLIC_ENDPOINT is required}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-true}
      MEDIA_SIGNED_UPLOAD_TTL_SECONDS: ${MEDIA_SIGNED_UPLOAD_TTL_SECONDS:-600}
      MEDIA_SIGNED_READ_TTL_SECONDS: ${MEDIA_SIGNED_READ_TTL_SECONDS:-300}
      MEDIA_STRICT_READ_TTL_SECONDS: ${MEDIA_STRICT_READ_TTL_SECONDS:-30}
      MEDIA_SYNC_DELETE_MAX_FILES: ${MEDIA_SYNC_DELETE_MAX_FILES:-500}
      MEDIA_PUBLIC_FOLDER: ${MEDIA_PUBLIC_FOLDER:-uploads}
      MEDIA_PRIVATE_FOLDER: ${MEDIA_PRIVATE_FOLDER:-private/objects}

  gateway:
    image: ${NEBULA_IMAGE_PREFIX:-nebulanv-main}-gateway:${NEBULA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_HOST_PORT:-3002}:3002"
    environment:
      <<: *internal-targets
      NODE_ENV: production
      GATEWAY_HTTP_PORT: 3002
      GATEWAY_OUTBOUND_KEYS: ${GATEWAY_OUTBOUND_KEYS:?GATEWAY_OUTBOUND_KEYS is required}
      GATEWAY_APPLICATION_REGISTRY_JSON: ${GATEWAY_APPLICATION_REGISTRY_JSON:?GATEWAY_APPLICATION_REGISTRY_JSON is required}
      GATEWAY_JSON_LIMIT_BYTES: ${GATEWAY_JSON_LIMIT_BYTES:-262144}
      GATEWAY_RATE_LIMIT_TTL_MS: ${GATEWAY_RATE_LIMIT_TTL_MS:-60000}
      GATEWAY_RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-120}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:?GATEWAY_REDIS_URL is required}
      GATEWAY_READINESS_TIMEOUT_MS: ${GATEWAY_READINESS_TIMEOUT_MS:-1500}
      GATEWAY_IDEMPOTENCY_TTL_SECONDS: ${GATEWAY_IDEMPOTENCY_TTL_SECONDS:-86400}
      GATEWAY_IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS: ${GATEWAY_IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS:-60}
      GATEWAY_IDEMPOTENCY_MAX_RESPONSE_BYTES: ${GATEWAY_IDEMPOTENCY_MAX_RESPONSE_BYTES:-524288}
      MEDIA_RENDER_HTTP_URL: ${MEDIA_RENDER_HTTP_URL:-http://media-service:3007}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio-data:
